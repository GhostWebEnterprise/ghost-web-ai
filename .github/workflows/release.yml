name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify gates before release
        run: |
          bunx tsc -b --noEmit
          bun test

      - name: Production build
        run: npx vite build

      - name: Generate artifact manifest (sha256)
        run: sh ./scripts/gen-manifest.sh

      - name: Smoke-check the built output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          grep -q '<div id="root">' dist/index.html || { echo "root div missing"; exit 1; }

      - name: Extract release notes from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "## Ghost Web AI ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Automated release built from tag \`${GITHUB_REF_NAME}\`." >> RELEASE_NOTES.md
          echo "All gates green: typecheck, tests, build. SHA-256 manifest attached." >> RELEASE_NOTES.md

      - name: Create GitHub release with artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/artifacts.sha256

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          retention-days: 14

  android-apk:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download verified web build
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Scaffold the Android shell (Capacitor)
        run: |
          bunx cap add android
          bunx cap sync android
          echo "--- scaffold contents ---"
          ls -la android/ | head -15
          head -3 android/gradlew || echo "gradlew missing after scaffold"

      - name: Apply themed matrix launcher icons
        run: |
          sh ./scripts/gen-icons.sh
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            || { echo "launcher icons missing after generation"; exit 1; }
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            || { echo "adaptive icon xml missing"; exit 1; }

      - name: Configure signed release build (version stamp + keystore)
        run: |
          node scripts/android-release-config.cjs "${GITHUB_REF_NAME}"
          test -f android/release-env.txt || { echo "release env file missing"; exit 1; }
          cat android/release-env.txt

      - name: Assemble signed release APK
        working-directory: android
        run: |
          test -f gradlew || { echo "gradlew not scaffolded"; exit 1; }
          chmod +x gradlew
          set -a
          . ./release-env.txt
          set +a
          sh gradlew assembleRelease --no-daemon

      - name: Verify signature and stage APK with release name
        run: |
          APK=$(ls android/app/build/outputs/apk/release/app-release*.apk 2>/dev/null | head -1)
          test -n "$APK" || { echo "release APK missing"; ls android/app/build/outputs/apk/ 2>/dev/null; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | head -5
          fi
          mkdir -p apk-out
          cp "$APK" "apk-out/ghost-web-ai-${{ github.ref_name }}.apk"

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/ghost-web-ai-*.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: apk-out/*.apk
          retention-days: 14

  desktop-installers:
    needs: build-and-release
    strategy:
      # Keep every OS running to its own conclusion so one failure does not
      # cancel the other installer builds mid-flight.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: "dmg zip"
          - os: ubuntu-latest
            targets: "AppImage deb"
          - os: windows-latest
            targets: "nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download verified web build
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Scaffold the Electron desktop shell (Capacitor Electron)
        run: |
          bunx cap add @capawesome/capacitor-electron
          bunx cap sync @capawesome/capacitor-electron
          test -f electron/main.ts || { echo "electron scaffold missing after cap add"; exit 1; }

      - name: Install Electron toolchain
        working-directory: electron
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Compile the Electron main process
        working-directory: electron
        shell: bash
        run: |
          npx tsc
          test -f build/main.js || { echo "build/main.js missing after tsc — packager entry point would fail"; exit 1; }

      - name: Vendor the Electron platform runtime
        working-directory: electron
        shell: bash
        run: |
          # Invoke the CLI via node: the scaffold package.json does not depend
          # on @capawesome/capacitor-electron, so its bin only exists in the
          # ROOT node_modules/.bin — which npx does not resolve reliably on
          # every runner OS. The script path is identical on all platforms.
          node ../node_modules/@capawesome/capacitor-electron/dist/cli/index.js vendor
          test -f vendor/node_modules/@capawesome/capacitor-electron/package.json \
            || { echo "vendor runtime missing after capacitor-electron vendor"; exit 1; }

      - name: Apply themed matrix app icons
        shell: bash
        run: sh ./scripts/gen-desktop-icons.sh

      - name: Build the platform installers
        working-directory: electron
        shell: bash
        env:
          # electron-builder reads these; unsigned builds are fine for
          # distribution via GitHub Releases.
          # NOTE: do NOT set GH_TOKEN here — with a token present,
          # electron-builder infers a GitHub publish provider and crashes on
          # update-metadata tasks even with --publish never when it cannot
          # resolve the repository. Packaging must stay publish-free.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          # Installers carry the release version (scaffold package.json is 0.0.0).
          # Non-tag runs (workflow_dispatch) get a neutral version.
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in
            [0-9]*) ;;
            *) VER="0.0.0" ;;
          esac
          case "${{ runner.os }}" in
            macOS)
              npx electron-builder --config electron-builder.config.js --mac dmg --mac zip \
                -c.extraMetadata.version="$VER" --publish never
              ;;
            Linux)
              # deb requires a maintainer and homepage; the scaffold metadata
              # does not carry them, so supply via -c overrides.
              npx electron-builder --config electron-builder.config.js --linux AppImage --linux deb \
                -c.extraMetadata.version="$VER" \
                -c.linux.maintainer="Ghost Web AI <ghostweb@ghostbin.cfd>" \
                -c.extraMetadata.homepage="https://github.com/${GITHUB_REPOSITORY}" \
                --publish never
              ;;
            Windows)
              npx electron-builder --config electron-builder.config.js --win nsis \
                -c.extraMetadata.version="$VER" --publish never
              ;;
          esac

      - name: Stage installers with release names
        shell: bash
        run: |
          mkdir -p desktop-out
          # *.exe is restricted to the NSIS installer name ("*Setup*.exe") —
          # electron-builder also drops helper exes like elevate.exe in dist/.
          find electron/dist -type f \
            \( -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*Setup*.exe" \) \
            -exec cp {} desktop-out/ \;
          # Normalize names: electron-builder emits spaces and the scaffold's
          # own package name — release assets use the project slug + tag.
          for f in desktop-out/*; do
            new="$(echo "$f" \
              | sed 's/ghost-web-ai-electron/ghost-web-ai/' \
              | sed 's/Ghost Web AI/ghost-web-ai/' \
              | sed 's/ Setup /-/')"
            if [ "$f" != "$new" ]; then mv "$f" "$new"; fi
          done
          ls -la desktop-out/
          ls desktop-out | grep -qE "\.(dmg|zip|AppImage|deb|exe)$" \
            || { echo "no installers staged"; exit 1; }

      - name: Attach desktop installers to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-out/*

      - name: Upload desktop workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ runner.os }}-${{ github.ref_name }}
          path: desktop-out/*
          retention-days: 14

  ios-shell:
    needs: build-and-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download verified web build
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Scaffold the iOS shell (Capacitor)
        run: |
          bunx cap add ios
          bunx cap sync ios
          test -d ios/App || { echo "iOS shell not scaffolded"; exit 1; }

      - name: Verify the Xcode workspace resolves
        run: |
          test -f ios/App/App.xcworkspace/contents.xcworkspacedata \
            || { echo "iOS workspace missing"; exit 1; }
          xcodebuild -list -workspace ios/App/App.xcworkspace 2>/dev/null \
            | head -20 || true

      - name: Upload iOS shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-shell-${{ github.ref_name }}
          path: ios/
          retention-days: 14

      - name: Note about signed iOS builds
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "iOS shell attached as a workflow artifact. Signed .ipa builds for" \
               "TestFlight/App Store need APPLE_CERTIFICATES secrets and are not" \
               "part of this pipeline yet." >> $GITHUB_STEP_SUMMARY
