name: Release

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release tag to build and publish (for example v0.2.4)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-release:
    # Release-write token is limited to trusted main and version-tag builds.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify gates before release
        run: |
          bunx tsc -b --noEmit
          bun test

      - name: Production build
        run: npx vite build

      - name: Generate artifact manifest (sha256)
        run: sh ./scripts/gen-manifest.sh

      - name: Smoke-check the built output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          grep -q '<div id="root">' dist/index.html || { echo "root div missing"; exit 1; }

      - name: Extract release notes from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "## Ghost Web AI ${GITHUB_REF_NAME}"
            echo ""
            echo "Automated release built from tag \`${GITHUB_REF_NAME}\`."
            echo "All gates green: typecheck, tests, build. SHA-256 manifest attached."
          } > RELEASE_NOTES.md

      - name: Refuse modifications to published release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matches="$(jq -c --arg tag "${GITHUB_REF_NAME}" '[.[] | select(.tag_name == $tag)]' <<< "${release_json}")"
          count="$(jq 'length' <<< "${matches}")"
          if [[ "${count}" == "1" ]]; then
            is_draft="$(jq -r '.[0].draft' <<< "${matches}")"
            test "${is_draft}" = true || {
              echo "::error::Refusing to modify published release ${GITHUB_REF_NAME}" >&2
              exit 1
            }
          elif [[ "${count}" != "0" ]]; then
            echo "::error::Multiple releases found for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Create or reuse draft release and attach web manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GITHUB_REF_NAME:?release tag missing}"
          test -s dist/artifacts.sha256 || {
            echo "::error::Web artifact checksum manifest missing" >&2
            exit 1
          }
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          tag_sha="$(jq -r '.object.sha' <<< "${tag_ref}")"
          tag_type="$(jq -r '.object.type' <<< "${tag_ref}")"
          if [ "${tag_type}" = "tag" ]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')"
          fi
          test "${tag_sha}" = "${GITHUB_SHA}" || {
            echo "::error::Release tag does not point to this build commit" >&2
            exit 1
          }

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matches="$(jq -c --arg tag "${GITHUB_REF_NAME}" '[.[] | select(.tag_name == $tag)]' <<< "${release_json}")"
          count="$(jq 'length' <<< "${matches}")"
          if [[ "${count}" == "1" ]]; then
            release_record="$(jq -c '.[0]' <<< "${matches}")"
            test "$(jq -r '.draft' <<< "${release_record}")" = true || {
              echo "::error::Refusing to modify published release ${GITHUB_REF_NAME}" >&2
              exit 1
            }
          elif [[ "${count}" == "0" ]]; then
            body="$(cat RELEASE_NOTES.md)"
            created="$(gh api --method POST \
              -F tag_name="${GITHUB_REF_NAME}" \
              -F target_commitish="${GITHUB_SHA}" \
              -F name="Ghost Web AI ${GITHUB_REF_NAME}" \
              -F body="${body}" \
              -F draft=true \
              "repos/${GITHUB_REPOSITORY}/releases")"
            jq -e --arg tag "${GITHUB_REF_NAME}" '.tag_name == $tag and .draft == true and (.id | type == "number")' <<< "${created}" >/dev/null
          else
            echo "::error::Multiple releases found for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matches="$(jq -c --arg tag "${GITHUB_REF_NAME}" '[.[] | select(.tag_name == $tag)]' <<< "${release_json}")"
          test "$(jq 'length' <<< "${matches}")" = "1" || {
            echo "::error::Expected exactly one draft release" >&2
            exit 1
          }
          release_record="$(jq -c '.[0]' <<< "${matches}")"
          release_id="$(jq -r '.id' <<< "${release_record}")"
          test "$(jq -r '.draft' <<< "${release_record}")" = true || {
            echo "::error::Release is not a draft" >&2
            exit 1
          }

          download_release_asset() {
            local asset_id="$1"
            local destination="$2"
            local headers status location
            headers="$(mktemp)"
            status="$(curl --silent --show-error --dump-header "$headers" \
              --output "$destination" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id")"
            case "$status" in
              200) ;;
              301|302|303|307|308)
                location="$(awk 'tolower($1) == "location:" { sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$headers")"
                test -n "$location" || {
                  rm -f "$headers" "$destination"
                  echo "::error::GitHub asset redirect omitted its download URL" >&2
                  return 1
                }
                curl --fail --silent --show-error --location "$location" --output "$destination"
                ;;
              *)
                rm -f "$headers" "$destination"
                echo "::error::GitHub asset download returned HTTP $status" >&2
                return 1
                ;;
            esac
            rm -f "$headers"
            test -s "$destination"
          }

          asset_name="artifacts.sha256"
          asset_matches="$(jq -c --arg name "${asset_name}" '[.assets[] | select(.name == $name)]' <<< "${release_record}")"
          asset_count="$(jq 'length' <<< "${asset_matches}")"
          mkdir -p existing-assets verified-assets
          if [[ "${asset_count}" == "1" ]]; then
            asset_id="$(jq -r '.[0].id' <<< "${asset_matches}")"
            download_release_asset "${asset_id}" "existing-assets/${asset_name}"
            cmp -s "dist/${asset_name}" "existing-assets/${asset_name}" || {
              echo "::error::Existing web checksum manifest differs; refusing overwrite" >&2
              exit 1
            }
          elif [[ "${asset_count}" == "0" ]]; then
            response="$(curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary "@dist/${asset_name}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset_name}")"
            jq -e --arg name "${asset_name}" '.name == $name and .state == "uploaded"' <<< "${response}" >/dev/null
          else
            echo "::error::Duplicate web manifest assets" >&2
            exit 1
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matches="$(jq -c --arg tag "${GITHUB_REF_NAME}" '[.[] | select(.tag_name == $tag)]' <<< "${release_json}")"
          release_record="$(jq -c '.[0]' <<< "${matches}")"
          asset_matches="$(jq -c --arg name "${asset_name}" '[.assets[] | select(.name == $name)]' <<< "${release_record}")"
          test "$(jq 'length' <<< "${asset_matches}")" = "1" || {
            echo "::error::Web checksum manifest was not uploaded exactly once" >&2
            exit 1
          }
          asset_record="$(jq -c '.[0]' <<< "${asset_matches}")"
          asset_id="$(jq -r '.id' <<< "${asset_record}")"
          expected="$(sha256sum "dist/${asset_name}" | cut -d' ' -f1)"
          digest="$(jq -r '.digest // empty' <<< "${asset_record}")"
          test "${digest#sha256:}" = "${expected}" || {
            echo "::error::Web checksum manifest digest mismatch" >&2
            exit 1
          }
          download_release_asset "${asset_id}" "verified-assets/${asset_name}"
          cmp -s "dist/${asset_name}" "verified-assets/${asset_name}" || {
            echo "::error::Downloaded web checksum manifest differs" >&2
            exit 1
          }
          echo "Verified draft release and immutable web checksum manifest."
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          retention-days: 14

  android-apk:
    # Only build/sign Android APKs for an explicit trusted release context.
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'v0.2.0 APK')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build-and-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Android release tag and published-version guard
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RELEASE_VERSION: ${{ inputs.release_version || '' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            if [[ "${HEAD_COMMIT_MESSAGE}" == *"v0.2.0 APK"* ]]; then
              RELEASE_TAG="v0.2.0"
            else
              RELEASE_TAG="${RELEASE_VERSION}"
            fi
          fi
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid Android release tag: ${RELEASE_TAG}" >&2
            exit 1
          }
          all_published_tags="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName')"
          published_tags="$(printf '%s\n' "${all_published_tags}" | grep -E '^v[0-9]+(\.[0-9]+)*(-[0-9]+)?$' || true)"
          latest_tag="$(printf '%s\n' "${published_tags}" | sort -V | tail -n 1)"
          if [ -n "${latest_tag}" ]; then
            highest_tag="$(printf '%s\n%s\n' "${latest_tag}" "${RELEASE_TAG}" | sort -V | tail -n 1)"
            if [ "${highest_tag}" != "${RELEASE_TAG}" ]; then
              echo "::error::Refusing non-monotonic Android release ${RELEASE_TAG}; latest published release is ${latest_tag}" >&2
              exit 1
            fi
          fi
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matches="$(jq -c --arg tag "${RELEASE_TAG}" '[.[] | select(.tag_name == $tag)]' <<< "${release_json}")"
          count="$(jq 'length' <<< "${matches}")"
          if [[ "${count}" == "1" ]]; then
            is_draft="$(jq -r '.[0].draft' <<< "${matches}")"
            test "${is_draft}" = true || {
              echo "::error::Refusing to modify published Android release ${RELEASE_TAG}" >&2
              exit 1
            }
          elif [[ "${count}" != "0" ]]; then
            echo "::error::Multiple releases found for ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download verified web build
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.run_id }}
          path: dist/

      - name: Scaffold the Android shell (Capacitor)
        run: |
          bunx cap add android
          bunx cap sync android
          echo "--- scaffold contents ---"
          find android -maxdepth 1 -mindepth 1 -print | head -15
          head -3 android/gradlew || echo "gradlew missing after scaffold"

      - name: Apply themed matrix launcher icons
        run: |
          sh ./scripts/gen-icons.sh
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            || { echo "launcher icons missing after generation"; exit 1; }
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            || { echo "adaptive icon xml missing"; exit 1; }

      - name: Configure signed release build (version stamp + keystore)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RELEASE_TAG:?validated release tag missing}"
          node scripts/android-release-config.cjs "${RELEASE_TAG}"

      - name: Assemble signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -f gradlew || { echo "gradlew not scaffolded"; exit 1; }
          chmod +x gradlew
          sh gradlew assembleRelease --no-daemon

      - name: Verify signature and stage APK with release name
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' 2>/dev/null)
          test "${#APKS[@]}" -eq 1 || { echo "::error::Expected exactly one release APK"; exit 1; }
          APK="${APKS[0]}"
          [[ "$APK" != *unsigned* ]] || { echo "::error::Unsigned APK refused"; exit 1; }
          test -n "$APK" || { echo "release APK missing"; find android/app/build/outputs/apk/ -maxdepth 2 -type f 2>/dev/null; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME"/build-tools -type f -name apksigner -print | sort -V | tail -1)
          test -n "$APKSIGNER" && test -x "$APKSIGNER" || { echo "::error::apksigner missing" >&2; exit 1; }
          mkdir -p apk-out
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-out/apksigner.txt
          grep -Fq "Verifies" apk-out/apksigner.txt || {
            echo "::error::APK signature verification did not report Verifies" >&2
            exit 1
          }
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" apk-out/apksigner.txt || {
            echo "::error::APK Signature Scheme v2 is required" >&2
            exit 1
          }
          AAPT=$(find "$ANDROID_HOME"/build-tools -type f -name aapt -print | sort -V | tail -1)
          test -n "$AAPT" && test -x "$AAPT" || { echo "::error::aapt missing" >&2; exit 1; }
          "$AAPT" dump badging "$APK" | tee apk-out/apk-badging.txt
          MIN_SDK="$(sed -n "s/^sdkVersion:'\([0-9][0-9]*\)'.*/\1/p" apk-out/apk-badging.txt | head -n 1)"
          [[ "$MIN_SDK" =~ ^[0-9]+$ ]] || { echo "::error::Could not determine APK minimum SDK" >&2; exit 1; }
          if (( MIN_SDK < 24 )); then
            grep -Fq "Verified using v1 scheme (JAR signing): true" apk-out/apksigner.txt || {
              echo "::error::APK minSdk is below 24 but V1/JAR signature verification is not valid" >&2
              exit 1
            }
          fi
          V1_META_WARNING_COUNT="$(grep -c '^WARNING: META-INF/' apk-out/apksigner.txt || true)"
          {
            echo "Minimum SDK: $MIN_SDK"
            echo "V1 META-INF unprotected-entry warning count: $V1_META_WARNING_COUNT"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( MIN_SDK < 24 && V1_META_WARNING_COUNT > 0 )); then
            echo "::error::V1/JAR signing leaves $V1_META_WARNING_COUNT META-INF entries unauthenticated on minSdk $MIN_SDK; refusing an update-compatible Android release." >&2
            exit 1
          fi
          grep -Fq "Number of signers: 1" apk-out/apksigner.txt || {
            echo "::error::Expected exactly one APK signer" >&2
            exit 1
          }
          # Preserve the signing identity of the already-published v0.2.3 APK.
          # A different certificate would make this same-package update
          # uninstall/reinstall-only, so fail closed rather than publish it.
          EXPECTED_SIGNER_SHA256="556745ef7356f3debfac112a66bbfe67d96fcb303c44d1b66d17bd8d5f209006"
          grep -Fq "$EXPECTED_SIGNER_SHA256" apk-out/apksigner.txt || {
            echo "::error::APK signer differs from published v0.2.3 identity; refusing update-incompatible release" >&2
            exit 1
          }
          sha256sum "$APK"
          : "${RELEASE_TAG:?validated release tag missing}"
          cp "$APK" "apk-out/ghost-web-ai-${RELEASE_TAG}.apk"
          (cd apk-out && sha256sum ./*.apk > SHA256SUMS)
          (cd apk-out && sha256sum --check SHA256SUMS)

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, 'v0.2.0 APK') || github.event_name == 'workflow_dispatch'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RELEASE_TAG:?validated release tag missing}"

          APK_PATH="apk-out/ghost-web-ai-${RELEASE_TAG}.apk"
          CHECKSUM_ASSET="SHA256SUMS"
          SIGNATURE_ASSET="apksigner.txt"
          EXPECTED_SIGNER_SHA256="556745ef7356f3debfac112a66bbfe67d96fcb303c44d1b66d17bd8d5f209006"
          test -s "${APK_PATH}" || {
            echo "::error::Expected APK missing: ${APK_PATH}" >&2
            ls -la apk-out/
            exit 1
          }
          (cd apk-out && sha256sum --check "${CHECKSUM_ASSET}")
          grep -Fq "Verifies" "apk-out/${SIGNATURE_ASSET}"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "apk-out/${SIGNATURE_ASSET}"
          grep -Fq "Number of signers: 1" "apk-out/${SIGNATURE_ASSET}"
          grep -Fq "certificate SHA-256 digest: ${EXPECTED_SIGNER_SHA256}" "apk-out/${SIGNATURE_ASSET}"

          resolve_tag_commit() {
            local ref_json object_sha object_type ref_error
            ref_error="$(mktemp)"
            if ! ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>"${ref_error}")"; then
              if grep -q '404' "${ref_error}"; then
                rm -f "${ref_error}"
                return 2
              fi
              cat "${ref_error}" >&2
              rm -f "${ref_error}"
              return 1
            fi
            rm -f "${ref_error}"
            object_sha="$(jq -r '.object.sha' <<< "${ref_json}")"
            object_type="$(jq -r '.object.type' <<< "${ref_json}")"
            case "${object_type}" in
              commit) printf '%s\n' "${object_sha}" ;;
              tag) gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha' ;;
              *) echo "::error::Unexpected Git tag object type: ${object_type}" >&2; return 1 ;;
            esac
          }

          tag_commit=""
          if tag_commit="$(resolve_tag_commit)"; then
            test "${tag_commit}" = "${GITHUB_SHA}" || {
              echo "::error::Release tag resolves to ${tag_commit}, not build commit ${GITHUB_SHA}" >&2
              exit 1
            }
          else
            resolve_status=$?
            test "${resolve_status}" -eq 2 || exit "${resolve_status}"
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "::error::Tag-triggered Android release tag is missing" >&2
              exit 1
            fi
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matches="$(jq -c --arg tag "${RELEASE_TAG}" '[.[] | select(.tag_name == $tag)]' <<< "${release_json}")"
          release_count="$(jq 'length' <<< "${matches}")"
          if [[ "${release_count}" == "1" ]]; then
            release_record="$(jq -c '.[0]' <<< "${matches}")"
            test "$(jq -r '.draft' <<< "${release_record}")" = true || {
              echo "::error::Refusing to modify published release ${RELEASE_TAG}" >&2
              exit 1
            }
            test -n "${tag_commit}" || {
              echo "::error::Draft release exists but its Git tag is missing; refusing implicit repair" >&2
              exit 1
            }
          elif [[ "${release_count}" == "0" ]]; then
            created="$(gh api --method POST \
              -F tag_name="${RELEASE_TAG}" \
              -F target_commitish="${GITHUB_SHA}" \
              -F name="Ghost Web AI ${RELEASE_TAG}" \
              -F generate_release_notes=true \
              -F draft=true \
              "repos/${GITHUB_REPOSITORY}/releases")"
            jq -e --arg tag "${RELEASE_TAG}" '.tag_name == $tag and .draft == true and (.id | type == "number")' <<< "${created}" >/dev/null
          else
            echo "::error::Multiple releases found for ${RELEASE_TAG}" >&2
            exit 1
          fi

          tag_commit="$(resolve_tag_commit)"
          test "${tag_commit}" = "${GITHUB_SHA}" || {
            echo "::error::Release tag does not point to this build commit" >&2
            exit 1
          }

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matches="$(jq -c --arg tag "${RELEASE_TAG}" '[.[] | select(.tag_name == $tag)]' <<< "${release_json}")"
          test "$(jq 'length' <<< "${matches}")" = "1" || {
            echo "::error::Expected exactly one release for ${RELEASE_TAG}" >&2
            exit 1
          }
          release_record="$(jq -c '.[0]' <<< "${matches}")"
          release_id="$(jq -r '.id' <<< "${release_record}")"
          test "$(jq -r '.draft' <<< "${release_record}")" = true || {
            echo "::error::Release is not a draft; refusing asset changes" >&2
            exit 1
          }

          assets=("${APK_PATH}" "apk-out/${CHECKSUM_ASSET}" "apk-out/${SIGNATURE_ASSET}")
          mkdir -p existing-assets verified-assets
          download_release_asset() {
            local asset_id="$1"
            local destination="$2"
            local headers status location
            headers="$(mktemp)"
            status="$(curl --silent --show-error --dump-header "$headers" \
              --output "$destination" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id")"
            case "$status" in
              200) ;;
              301|302|303|307|308)
                location="$(awk 'tolower($1) == "location:" { sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$headers")"
                test -n "$location" || {
                  rm -f "$headers" "$destination"
                  echo "::error::GitHub asset redirect omitted its download URL" >&2
                  return 1
                }
                # The signed object-storage URL must not receive the GitHub token.
                curl --fail --silent --show-error --location "$location" --output "$destination"
                ;;
              *)
                rm -f "$headers" "$destination"
                echo "::error::GitHub asset download returned HTTP $status" >&2
                return 1
                ;;
            esac
            rm -f "$headers"
            test -s "$destination"
          }

          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            asset_matches="$(jq -c --arg name "$name" '[.assets[] | select(.name == $name)]' <<< "${release_record}")"
            asset_count="$(jq 'length' <<< "${asset_matches}")"
            if [[ "${asset_count}" == "1" ]]; then
              asset_id="$(jq -r '.[0].id' <<< "${asset_matches}")"
              download_release_asset "${asset_id}" "existing-assets/${name}"
              cmp -s "$asset" "existing-assets/${name}" || {
                echo "::error::Existing immutable release asset differs: ${name}" >&2
                exit 1
              }
            elif [[ "${asset_count}" == "0" ]]; then
              encoded_name="$(jq -rn --arg value "$name" '$value | @uri')"
              response="$(curl --fail --silent --show-error --request POST \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "Content-Type: application/octet-stream" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary "@$asset" \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${encoded_name}")"
              jq -e --arg name "$name" '.name == $name and .state == "uploaded"' <<< "$response" >/dev/null || {
                echo "::error::GitHub did not confirm upload of ${name}" >&2
                exit 1
              }
            else
              echo "::error::Duplicate release assets named ${name}" >&2
              exit 1
            fi
          done

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matches="$(jq -c --arg tag "${RELEASE_TAG}" '[.[] | select(.tag_name == $tag)]' <<< "${release_json}")"
          test "$(jq 'length' <<< "${matches}")" = "1" || {
            echo "::error::Release disappeared or became ambiguous" >&2
            exit 1
          }
          release_record="$(jq -c '.[0]' <<< "${matches}")"
          release_id="$(jq -r '.id' <<< "${release_record}")"
          test "$(jq -r '.draft' <<< "${release_record}")" = true || {
            echo "::error::Release is no longer a draft" >&2
            exit 1
          }

          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            expected="$(sha256sum "$asset" | cut -d' ' -f1)"
            asset_matches="$(jq -c --arg name "$name" '[.assets[] | select(.name == $name)]' <<< "${release_record}")"
            test "$(jq 'length' <<< "${asset_matches}")" = "1" || {
              echo "::error::Expected exactly one uploaded asset: ${name}" >&2
              exit 1
            }
            asset_record="$(jq -c '.[0]' <<< "${asset_matches}")"
            asset_id="$(jq -r '.id' <<< "${asset_record}")"
            digest="$(jq -r '.digest // empty' <<< "${asset_record}")"
            test "${digest#sha256:}" = "${expected}" || {
              echo "::error::GitHub asset digest mismatch: ${name}" >&2
              exit 1
            }
            download_release_asset "${asset_id}" "verified-assets/${name}"
            cmp -s "$asset" "verified-assets/${name}" || {
              echo "::error::Downloaded release asset differs: ${name}" >&2
              exit 1
            }
          done

          (cd verified-assets && sha256sum --check "${CHECKSUM_ASSET}")
          EXPECTED_APK_SHA256="$(awk 'NR == 1 {print $1}' "apk-out/${CHECKSUM_ASSET}")"
          ACTUAL_APK_SHA256="$(jq -r --arg name "$(basename "${APK_PATH}")" '[.assets[] | select(.name == $name)] | if length == 1 then .[0].digest else empty end' <<< "${release_record}" | sed 's/^sha256://')"
          test -n "${ACTUAL_APK_SHA256}" && test "${EXPECTED_APK_SHA256}" = "${ACTUAL_APK_SHA256}" || {
            echo "::error::GitHub APK digest differs from verified checksum manifest" >&2
            exit 1
          }
          echo "Verified immutable APK, SHA-256 manifest, GitHub asset digests, downloaded bytes and apksigner evidence."

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_id }}
          path: apk-out/
          retention-days: 14
      - name: Remove Android signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f android/release.keystore
          test ! -e android/release.keystore || {
            echo "::error::Android release keystore cleanup failed" >&2
            exit 1
          }

      - name: Publish verified Android release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, 'v0.2.0 APK') || github.event_name == 'workflow_dispatch'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RELEASE_TAG:?validated release tag missing}"
          APK_PATH="apk-out/ghost-web-ai-${RELEASE_TAG}.apk"
          assets=("${APK_PATH}" "apk-out/SHA256SUMS" "apk-out/apksigner.txt")

          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          tag_sha="$(jq -r '.object.sha' <<< "${tag_ref}")"
          tag_type="$(jq -r '.object.type' <<< "${tag_ref}")"
          if [ "${tag_type}" = "tag" ]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')"
          fi
          test "${tag_sha}" = "${GITHUB_SHA}" || {
            echo "::error::Release tag no longer points to this verified build commit" >&2
            exit 1
          }

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matches="$(jq -c --arg tag "${RELEASE_TAG}" '[.[] | select(.tag_name == $tag)]' <<< "${release_json}")"
          test "$(jq 'length' <<< "${matches}")" = "1" || {
            echo "::error::Expected exactly one release before publication" >&2
            exit 1
          }
          release_record="$(jq -c '.[0]' <<< "${matches}")"
          release_id="$(jq -r '.id' <<< "${release_record}")"
          test "$(jq -r '.draft' <<< "${release_record}")" = true || {
            echo "::error::Refusing to publish a missing or already-published Android release" >&2
            exit 1
          }

          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            expected="$(sha256sum "$asset" | cut -d' ' -f1)"
            actual="$(jq -r --arg name "$name" '[.assets[] | select(.name == $name)] | if length == 1 then .[0].digest else empty end' <<< "${release_record}" | sed 's/^sha256://')"
            test "$actual" = "$expected" || {
              echo "::error::Refusing publication: asset digest mismatch for ${name}" >&2
              exit 1
            }
          done

          published="$(gh api --method PATCH -F draft=false "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          jq -e '.draft == false and .published_at != null' <<< "${published}" >/dev/null || {
            echo "::error::GitHub did not confirm Android release publication" >&2
            exit 1
          }
          final_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          final_matches="$(jq -c --arg tag "${RELEASE_TAG}" '[.[] | select(.tag_name == $tag)]' <<< "${final_json}")"
          test "$(jq 'length' <<< "${final_matches}")" = "1" || {
            echo "::error::Published release could not be uniquely re-read" >&2
            exit 1
          }
          final_record="$(jq -c '.[0]' <<< "${final_matches}")"
          jq -e '.draft == false and .published_at != null' <<< "${final_record}" >/dev/null || {
            echo "::error::Final Android release state is not published" >&2
            exit 1
          }
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            expected="$(sha256sum "$asset" | cut -d' ' -f1)"
            actual="$(jq -r --arg name "$name" '[.assets[] | select(.name == $name)] | if length == 1 then .[0].digest else empty end' <<< "${final_record}" | sed 's/^sha256://')"
            test "$actual" = "$expected" || {
              echo "::error::Published release asset digest changed: ${name}" >&2
              exit 1
            }
          done

  desktop-installers:
    needs: build-and-release
    strategy:
      # Keep every OS running to its own conclusion so one failure does not
      # cancel the other installer builds mid-flight.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: "dmg zip"
          - os: ubuntu-latest
            targets: "AppImage deb"
          - os: windows-latest
            targets: "nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download verified web build
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.run_id }}
          path: dist/

      - name: Scaffold the Electron desktop shell (Capacitor Electron)
        run: |
          bunx cap add @capawesome/capacitor-electron
          bunx cap sync @capawesome/capacitor-electron
          test -f electron/main.ts || { echo "electron scaffold missing after cap add"; exit 1; }

      - name: Install Electron toolchain
        working-directory: electron
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Compile the Electron main process
        working-directory: electron
        shell: bash
        run: |
          npx tsc
          test -f build/main.js || { echo "build/main.js missing after tsc — packager entry point would fail"; exit 1; }

      - name: Vendor the Electron platform runtime
        working-directory: electron
        shell: bash
        run: |
          # Invoke the CLI via node: the scaffold package.json does not depend
          # on @capawesome/capacitor-electron, so its bin only exists in the
          # ROOT node_modules/.bin — which npx does not resolve reliably on
          # every runner OS. The script path is identical on all platforms.
          node ../node_modules/@capawesome/capacitor-electron/dist/cli/index.js vendor
          test -f vendor/node_modules/@capawesome/capacitor-electron/package.json \
            || { echo "vendor runtime missing after capacitor-electron vendor"; exit 1; }

      - name: Apply themed matrix app icons
        shell: bash
        run: sh ./scripts/gen-desktop-icons.sh

      - name: Build the platform installers
        working-directory: electron
        shell: bash
        env:
          # electron-builder reads these; unsigned builds are fine for
          # distribution via GitHub Releases.
          # NOTE: do NOT set GH_TOKEN here — with a token present,
          # electron-builder infers a GitHub publish provider and crashes on
          # update-metadata tasks even with --publish never when it cannot
          # resolve the repository. Packaging must stay publish-free.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          # Installers carry the release version (scaffold package.json is 0.0.0).
          # Non-tag runs (workflow_dispatch) get a neutral version.
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in
            [0-9]*) ;;
            *) VER="0.0.0" ;;
          esac
          case "${{ runner.os }}" in
            macOS)
              npx electron-builder --config electron-builder.config.js --mac dmg --mac zip \
                -c.extraMetadata.version="$VER" --publish never
              ;;
            Linux)
              # deb requires a maintainer and homepage; the scaffold metadata
              # does not carry them, so supply via -c overrides.
              npx electron-builder --config electron-builder.config.js --linux AppImage --linux deb \
                -c.extraMetadata.version="$VER" \
                -c.linux.maintainer="Ghost Web AI <support-ghostweb@proton.me>" \
                -c.extraMetadata.homepage="https://github.com/${GITHUB_REPOSITORY}" \
                --publish never
              ;;
            Windows)
              npx electron-builder --config electron-builder.config.js --win nsis \
                -c.extraMetadata.version="$VER" --publish never
              ;;
          esac

      - name: Stage installers with release names
        shell: bash
        run: |
          mkdir -p desktop-out
          # *.exe is restricted to the NSIS installer name ("*Setup*.exe") —
          # electron-builder also drops helper exes like elevate.exe in dist/.
          find electron/dist -type f \
            \( -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*Setup*.exe" \) \
            -exec cp {} desktop-out/ \;
          # Normalize names: electron-builder emits spaces and the scaffold's
          # own package name — release assets use the project slug + tag.
          for f in desktop-out/*; do
            new="$(echo "$f" \
              | sed 's/ghost-web-ai-electron/ghost-web-ai/' \
              | sed 's/Ghost Web AI/ghost-web-ai/' \
              | sed 's/ Setup /-/')"
            if [ "$f" != "$new" ]; then mv "$f" "$new"; fi
          done
          ls -la desktop-out/
          find desktop-out -maxdepth 1 -type f -print -quit | grep -q . \
            || { echo "no installers staged"; exit 1; }

      # The Android job can publish the release before desktop installers finish.
      # Do not allow late desktop uploads to mutate an already published release.
      # A separate draft-only staging/publish gate is required for desktop assets.
      - name: Hold desktop installers as workflow artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "Desktop installers are retained as workflow artifacts; public release assets remain immutable."

      - name: Upload desktop workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ runner.os }}-${{ github.ref_name }}
          path: desktop-out/*
          retention-days: 14

  ios-shell:
    needs: build-and-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download verified web build
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.run_id }}
          path: dist/

      - name: Scaffold the iOS shell (Capacitor)
        run: |
          bunx cap add ios
          bunx cap sync ios
          test -d ios/App || { echo "iOS shell not scaffolded"; exit 1; }

      - name: Verify the Xcode workspace resolves
        run: |
          test -f ios/App/App.xcworkspace/contents.xcworkspacedata \
            || { echo "iOS workspace missing"; exit 1; }
          xcodebuild -list -workspace ios/App/App.xcworkspace 2>/dev/null \
            | head -20 || true

      - name: Upload iOS shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-shell-${{ github.ref_name }}
          path: ios/
          retention-days: 14

      - name: Note about signed iOS builds
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "iOS shell attached as a workflow artifact. Signed .ipa builds for"
            echo "TestFlight/App Store need APPLE_CERTIFICATES secrets and are not"
            echo "part of this pipeline yet."
          } >> "$GITHUB_STEP_SUMMARY"

