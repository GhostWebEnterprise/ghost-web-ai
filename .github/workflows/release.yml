name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify gates before release
        run: |
          bunx tsc -b --noEmit
          bun test

      - name: Production build
        run: npx vite build

      - name: Generate artifact manifest (sha256)
        run: sh ./scripts/gen-manifest.sh

      - name: Smoke-check the built output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          grep -q '<div id="root">' dist/index.html || { echo "root div missing"; exit 1; }

      - name: Extract release notes from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "## Ghost Web AI ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Automated release built from tag \`${GITHUB_REF_NAME}\`." >> RELEASE_NOTES.md
          echo "All gates green: typecheck, tests, build. SHA-256 manifest attached." >> RELEASE_NOTES.md

      - name: Create GitHub release with artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/artifacts.sha256

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          retention-days: 14

  android-apk:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download verified web build
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Scaffold the Android shell (Capacitor)
        run: |
          bunx cap add android
          bunx cap sync android

      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK with release name
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "apk-out/ghost-web-ai-${{ github.ref_name }}.apk"

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/ghost-web-ai-*.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: apk-out/*.apk
          retention-days: 14
